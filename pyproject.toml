[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runreckon"
version = "0.1.0"
description = "Score how an AI agent executed a run, not just whether it finished: deterministic scoring of recorded agent traces (tool selection, argument validity, step economy, error recovery, policy compliance, cost) with a fault-injection self-test that measures the scorer itself."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["agent-evaluation", "llm-evals", "ai-agents", "agent-traces", "evaluation", "mcp", "observability", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
runreckon = "runreckon.cli:main"

[project.urls]
Homepage = "https://github.com/ranadhir19/runreckon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runreckon = ["examples/*/*.json", "examples/*/*.jsonl", "examples/*.json"]
